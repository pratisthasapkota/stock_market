services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./deploy/timescale-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://stock:stock@db:5432/stock
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery worker -l info -Q crawl,categorize
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://stock:stock@db:5432/stock
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  beat:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://stock:stock@db:5432/stock
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  web:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - api

volumes:
  dbdata:
